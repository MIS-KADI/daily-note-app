name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.3.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.3.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.3
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.3 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.3)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **ખરીદી સીધી ખર્ચમાં વિગતવાર સેવ:** ખરીદીની વસ્તુઓ (દા.ત. ₹૧૫૦) સીધી ખર્ચમાં ઉમેરતી વખતે તમામ વસ્તુઓની વિગત સાથે સેવ થાય છે.
            - **ખાતાવહીમાં મોબાઇલ નંબર એડિટ/ઉમેરો:** અવાજથી ઉમેરેલ ખાતામાં મોબાઇલ નંબર ન હોય તો ૧-ક્લિકમાં `+ ફોન નંબર ઉમેરો` બટન અને એડિટ બટનથી સરળતાથી નંબર સેવ કરી WhatsApp રીમાઇન્ડર મોકલી શકાય છે.
            - **કામો/રીમાઇન્ડર કાર્ડ સુધારો:** વધારાના ચેકલિસ્ટ પ્રોગ્રેસ બોક્સ હટાવી એકદમ સુંદર, ચોખ્ખું અને આધુનિક કાર્ડ લેઆઉટ.
            - **મોબાઇલ સ્ક્રીન ફિટ અને ટોપ બાર ક્લીનઅપ:** મોબાઇલ સ્ક્રીનમાં ૧૦૦% પરફેક્ટ ફિટ, ઉપરથી ડાયરી નામ, યુઝર નામ, સુરક્ષિત અને આસિસ્ટન્ટ હટાવી કોમ્પેક્ટ અને સ્મૂધ બાર.
            - **હાઇ સ્પીડ અને સુપર સ્મૂધ પર્ફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.3.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.3.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
