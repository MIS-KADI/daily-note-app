name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.10.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.10.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.10
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.10 Lightweight <8MB)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.10)

            આ નવા વર્ઝનમાં કરવામાં આવેલા સુધારા:
            - **સુપર લાઇટવેઇટ સાઈઝ ફિક્સ (માત્ર ~૭.૮ MB):** અગાઉ જૂની APK ફાઈલો પબ્લિક એસેટ્સમાં કોપી થવાને કારણે એપની સાઈઝ મોટી થઈ ગઈ હતી. હવે તે તમામ વધારાની ફાઈલો કાયમી માટે હટાવીને સાઈઝ પાછી **૭.૮ MB (૧૦ MB થી પણ ઓછી)** કરી દેવામાં આવી છે!
            - **સંપૂર્ણ ડાર્ક મોડ કોન્ટ્રાસ્ટ:** તમામ ગ્રાફ, ચાર્ટ્સ, મોશન સેન્સર કાર્ડ અને દવાઓનું રૂટિન ડાર્ક મોડમાં સ્ફટિક સ્પષ્ટ અને હાઇ-કોન્ટ્રાસ્ટ સાથે વંચાય તેવું કરી દીધું છે.
            - **શુદ્ધ ગુજરાતી ભાષાંતર:** "રોકડ સિલક" અને "બધું જુઓ" સહિતના તમામ લેબલ્સ ઉમેરી દીધા છે.
            - **સુપરફાસ્ટ પર્ફોર્મન્સ અને સ્મૂધ યુઝર એક્સપિરિયન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.10.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.10.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
