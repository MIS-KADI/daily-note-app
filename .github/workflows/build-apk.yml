name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.31.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.31.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.31
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.31 Speech Stutter Fix, DD/MM/YYYY, Hindi UI, Frames, PDF Scanner)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.31)

            આ નવા વર્ઝન v1.0.31 માં કરવામાં આવેલા તમામ ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **🎙️ બોલીને ટાઈપ કરતી વખતે થતું રિપીટેશન સંપૂર્ણ ફિક્સ (Voice Typing Stutter Fix):**
              - સ્પીચ રેકગ્નિશન સેશન દરમિયાન શબ્દોનું વારંવાર ડુપ્લિકેશન અટકાવ્યું છે.
            - **📅 તારીખનું સુવ્યવસ્થિત ફોર્મેટ (DD/MM/YYYY Format Across the App):**
              - મોબાઇલના કેલેન્ડર મુજબ અથવા સ્પષ્ટ dd/mm/yyyy મુજબ જ તારીખો પ્રદર્શિત થાય છે.
            - **🌐 ઓનલાઇન & ક્લાઉડ સિંક સુવિધા (Online Cloud Sync & Real-time Network Indicator):**
              - એપ હવે ઓનલાઇન ક્લાઉડ કનેક્ટિવિટી, ગુગલ ડ્રાઇવ બેકઅપ અને રિયલ-ટાઇમ કનેક્શન ઇન્ડિકેટર સાથે સજ્જ છે.
            - **💳 નાણાકીય હિસાબ & ચુકવણી મોડ સુધારો (Finance & Payment Modes):**
              - રોકડ (Cash) અને UPI (GPay/PhonePe) ઝડપી ૧-ટેપ બટન સાથે ટોચના ક્રમે ગોઠવવામાં આવ્યા છે.
              - ૧૭ જેટલી નવી અને ઉપયોગી દૈનિક કેટેગરીઝ (શોપિંગ, રેસ્ટોરન્ટ/ખોરાક, મનોરંજન, ભાડું, લોન/EMI, રિપેરિંગ, દાન, બચત/SIP, સલૂન વગેરે) ઉમેરવામાં આવી છે.
              - બેંક SMS ઓટો-ડિટેક્શનમાં પણ તમામ નવી કેટેગરીઝ સચોટ સિંક થાય છે.
            - **🇮🇳 હિન્દી ભાષામાં સંપૂર્ણ સુધારો (100% Complete Hindi UI Translations):**
              - હિન્દી ભાષા પસંદ કરવા પર પ્રોફાઇલ, રિમાઇન્ડર્સ, બાયોમેટ્રિક્સ અને બેકઅપનું તમામ લખાણ શુદ્ધ હિન્દીમાં જ દેખાય છે.
            - **🖼️ ફોટો ગેલેરીમાં ૧૮ ફિલ્ટર્સ, ૮ રોયલ ફ્રેમ્સ અને ૬ ફોટા સુધીનો કોલાઝ (Artistic Filters, Frames & 6-Photo Collage):**
              - વિન્ટેજ, રોયલ સેપિયા, સિનેમેટિક, ગોલ્ડન અવર, સાયબરપંક જેવા ૧૮ ફિલ્ટર્સ.
              - પોલરોઇડ, રોયલ ગોલ્ડન, નિયોન ગ્લો, ફિલ્મસ્ટ્રીપ, વુડન જેવી ૮ પ્રીમિયમ ફ્રેમ્સ.
              - ૨ થી ૬ ફોટા સુધીનો મલ્ટી-લેઆઉટ અને ગોલ્ડન બોર્ડર કોલાઝ મેકર.
            - **📄 નવું PDF સ્કેનર અને ફોટો માંથી PDF કન્વર્ટર (Document Scanner & Photo to PDF Export):**
              - કેમેરા કે ગેલેરીમાંથી બિલ, રસીદ કે ફોટા સ્કેન કરી મેજિક કલર કે ક્લીન B&W દસ્તાવેજ બનાવી ૧-ક્લિકમાં PDF ડાઉનલોડ & શેર કરો.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.31.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.31.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
