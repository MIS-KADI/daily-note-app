name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.24.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.24.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.24
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.24 Instant Launch Fix & Fast Startup)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.24)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **⚡ એપ ઓપનિંગ બ્લેન્ક સ્ક્રીન ફિક્સ (Instant Launch Fix):**
              - એપ ઓપન કરતી વખતે આવતી બ્લેન્ક/અટકી જતી સ્ક્રીનની સમસ્યા સંપૂર્ણપણે ફિક્સ કરી દેવાઈ છે.
              - હવે એપ ટચ કરતાં જ સીધી સ્મૂથલી અને કોઈ પણ અડચણ વગર હોમ સ્ક્રીન પર ખૂલે છે.
            - **✨ નવો રોયલ એપ આઇકન (Golden Feather Quill & Luxury Diary):**
              - મોબાઇલ હોમસ્ક્રીન પર અતિ આકર્ષક ગોલ્ડન કલમ અને પ્રીમિયમ રોયલ ડાયરી આઇકન.
            - **🚀 ફાસ્ટ અને સુપર સ્મૂથ પરફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.24.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.24.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
