name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.38.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.38.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.38
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.38 Minimal Offline UI & Continuous Step Counter)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.38)

            આ નવા વર્ઝન v1.0.38 માં કરવામાં આવેલા સુધારાઓ:
            - **🚫 ક્લીન અને મિનિમલ ઇન્ટરનેટ ગેટકીપર સ્ક્રીન (Clean & Minimal Offline Screen):**
              - યુઝરના આપેલા સ્ક્રીનશોટ મુજબ માત્ર જરૂરી વિગતો જ રાખવામાં આવી છે (વધારાના બોક્સ, ચેકલિસ્ટ બટન અને ફૂટર હટાવી લીધા છે).
              - રેડ-ઓરેન્જ સ્ક્વિર્કલ `WifiOff` + `OFFLINE` બેજ, શાનદાર ટાઇટલ અને માર્ગદર્શિકા.
              - ફોનમાં મોબાઇલ ડેટા કે Wi-Fi ચાલુ થતાં જ ૧.૫ સેકન્ડમાં આપમેળે એપ ઓપન થઈ જશે.
            - **👟 ૧૦૦% અવિરત સ્ટેપ કાઉન્ટિંગ (Uninterrupted Step Tracker):**
              - એપ ભલે ૧૦૦% ઓનલાઇન મોડમાં ચાલે, પરંતુ ડગલાંની ગણતરી (સ્ટેપ્સ કાઉન્ટિંગ) સતત ચાલુ રહેશે!
              - એન્ડ્રોઇડ હાર્ડવેર સેન્સર્સ અને બેકગ્રાઉન્ડ સર્વિસ દ્વારા દરરોજના તમામ ડગલાં સુરક્ષિત રીતે ગણાશે અને સેવ થશે.
            - **📑 પ્રો PDF સ્કેનર ટૂલકિટ (Whiteboard, Book, Proper Crop, Adjust, Cleanup, Reorder).**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.38.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.38.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
