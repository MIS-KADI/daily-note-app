name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.26.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.26.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.26
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.26 Zero Blank Screen & Instant Launch Fix)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.26)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **⚡ બ્લેન્ક/સફેદ સ્ક્રીનની ખામી સંપૂર્ણ ફિક્સ (Zero Blank Screen Fix):**
              - એપ ઓપન કરતી વખતે આવતી બ્લેન્ક/ખાલી સ્ક્રીનની સમસ્યાનું મૂળ કારણ (અનડિફાઇન્ડ સ્ટેટ વેરીએબલ્સ અને ટાઈમર કેલ્ક્યુલેશન) સંપૂર્ણપણે દૂર કરવામાં આવ્યું છે.
              - હવે એપ ટચ કરતાં જ તરત કોઈપણ અટકાવ વગર સીધી હોમ સ્ક્રીન પર ખૂલશે.
            - **🛡️ ગ્લોબલ એરર બાઉન્ડ્રી પ્રોટેક્શન (Crash Proof):**
              - એપમાં સેફગાર્ડ પ્રોટેક્શન ઉમેર્યું છે જેથી સ્ક્રીન ક્યારેય બ્લેન્ક ન રહે.
            - **🌅 સૂર્યોદય પ્રેરણા ડાયરી - ફુલ સાઈઝ ચોરસ/સ્ક્વિર્કલ આઇકન (Full-Size Squircle Icon):**
              - Option 3 ચોરસ સાઈઝમાં જ સેટ કરેલો છે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.26.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.26.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
