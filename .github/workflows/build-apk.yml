name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.12.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.12.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.12
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.12 Background Steps, Sound Alert & Multilingual AI)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.12)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **એક્યુરેટ હાર્ડવેર સ્ટેપ કાઉન્ટર (Background & Closed App Pedometer):** એપ બંધ હોય કે સ્ક્રીન બંધ હોય તો પણ ફોનના ડેડિકેટેડ સ્ટેપ હાર્ડવેર સેન્સર (Sensor.TYPE_STEP_COUNTER) દ્વારા સતત સ્ટેપ્સ ગણાય છે અને એપ ખુલતાની સાથે જ સિંક થઈ જાય છે.
            - **નોટિફિકેશનમાં મધુર અવાજ (Audible Notification Chime):** દરેક એલર્ટ અને નોટિફિકેશન સાથે ક્રિસ્ટલ ક્લિયર સાઉન્ડ વાગશે.
            - **સાઇન અપ ફોર્મ સંપૂર્ણ રદ:** એપ ઓપન કરતાં જ સીધી જ ઉપયોગમાં લઈ શકાય છે, કોઈ રજિસ્ટ્રેશન કે સાઇન અપ ફોર્મ નડશે નહિ.
            - **વીડિયો પ્લેયર દૂર કર્યો:** કાર્ટૂન વીડિયો ગાઈડ રદ કર્યો છે જેથી એપ સુપર ફાસ્ટ અને ક્લીન રહે.
            - **AI આસિસ્ટન્ટ ભાષા સિંક:** બોલવાની ભાષા (ગુજરાતી, હિન્દી, અંગ્રેજી) સિલેક્ટ કરતાં જ આખું પેજ અને તમામ બટનો-લેબલ તે જ ભાષામાં બદલાઈ જાય છે.
            - **અતિ હળવી સાઈઝ (<8 MB).**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.12.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.12.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
