name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.8.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.8.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.8
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.8 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.8)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **ડેમો મોડ બેનર અને બટન હટાવ્યું:** યુઝરની વિનંતી મુજબ ડેમો બેનર અને બટન સંપૂર્ણપણે હટાવી લેવામાં આવ્યું છે, જેથી કોઈપણ રોકટોક વગર સીધી જ નવી એન્ટ્રી ઉમેરી શકાય છે.
            - **ડાર્ક મોડ ડીપ એનાલિસિસ & કોન્ટ્રાસ્ટ ઓવરહોલ:** BMI કેલ્ક્યુલેટરનું સ્કોર મીટર કાર્ડ, ફિટનેસ & કાર્ડિયો કાર્ડ, વોટર ટ્રેકર, તમામ ક્વિક એક્શન ચિપ્સ (+૫૦૦ સ્ટેપ્સ, હેલ્થ એપ સિન્ક) અને સુવિચાર કાર્ડમાં વ્હાઇટ-ઓન-વ્હાઇટ અને અસ્પષ્ટ કલર્સ દૂર કરી સંપૂર્ણ હાઇ-કોન્ટ્રાસ્ટ અને આકર્ષક બનાવ્યા છે.
            - **લાઇટ અને ડાર્ક બંને મોડમાં સ્ફટિક સ્પષ્ટ વાંચનક્ષમતા:** બધા ટેક્સ્ટ્સ, નંબર્સ, સ્લાઇડર્સ અને બટનો બંને થીમમાં એકદમ સ્પષ્ટ દેખાય છે.
            - **સુપરફાસ્ટ પર્ફોર્મન્સ અને સ્મૂધ યુઝર એક્સપિરિયન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.8.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.8.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
