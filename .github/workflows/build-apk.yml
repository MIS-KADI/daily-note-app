name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.27.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.27.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.27
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.27 Shopping List & Quick Actions Fix)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.27)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **🛒 ખરીદી યાદી બટન સંપૂર્ણ સક્રિય (Shopping List Button Fixed & Fully Working):**
              - હોમ સ્ક્રીન પર આવેલ 'ખરીદી' (🛒) બટન ક્લિક કરતાં ખરીદી યાદીનું મોડલ તાત્કાલિક ખૂલે છે.
              - નામ કપાઈ જતું હતું (ખ...) તેની જગ્યાએ હવે સ્વચ્છ અને સ્પષ્ટ 'ખરીદી' ડિસ્પ્લે થાય છે.
              - ખરીદી યાદીમાં વસ્તુ ઉમેરો, ભાવ લખો, ચેકમાર્ક કરો અને સીધો ખર્ચ હિસાબમાં ટ્રાન્સફર કરી શકો છો.
            - **⚡ ફાસ્ટ સ્ટાર્ટઅપ અને સ્મૂથ લૉન્ચ:**
              - કોઈ બ્લેન્ક સ્ક્રીન વગર સીધી હોમ સ્ક્રીન પર ખૂલે છે.
            - **🌅 સૂર્યોદય પ્રેરણા ડાયરી - ફુલ સાઈઝ ચોરસ/સ્ક્વિર્કલ આઇકન.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.27.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.27.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
