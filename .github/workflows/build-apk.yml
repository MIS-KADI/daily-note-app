name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.23.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.23.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.23
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.23 Zero-White-Screen Instant Royal Splash & Daily Suvichar)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.23)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **⚡ સફેદ સ્ક્રીન સંપૂર્ણપણે બંધ (Zero White Flash Launch):**
              - એપ ઓપન કરતી વખતે આવતી સફેદ સ્ક્રીન સંપૂર્ણપણે બંધ કરી દેવાઈ છે.
              - Android 12+ નેટિવ સ્પ્લેશ API (`windowSplashScreenBackground`) અને ઇન્સ્ટન્ટ પ્રિ-લોડર દ્વારા એપ ટચ કરતાં જ ૧ મિલિસેકન્ડમાં રોયલ મિડનાઇટ નેવી (`#070D32`) અને ગોલ્ડન ડાયરી બ્રાન્ડિંગ ડિસ્પ્લે થાય છે.
            - **🌟 નવું ઇન્ટરેક્ટિવ સ્વાગત & દૈનિક સુવિચાર (Welcome Splash Screen):**
              - એપ ખૂલતાં જ સમય મુજબ શુભ સવાર / શુભ બપોર / શુભ સાંજ / શુભ રાત્રિનું સોનેરી અભિવાદન.
              - આજનો ગુજરાતી વાર, તારીખ અને દિવસનો પ્રેરણાદાયી સુવિચાર દર્શાવાય છે.
              - પ્રોફાઇલ / સેટિંગ્સમાંથી આ સ્ક્રીન ગમે ત્યારે ચાલુ/બંધ (On/Off) કરી શકાય છે.
            - **✨ નવો રોયલ એપ આઇકન અને પ્રીમિયમ સ્પ્લેશ બ્રાન્ડિંગ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.23.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.23.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
