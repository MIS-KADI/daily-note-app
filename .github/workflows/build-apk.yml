name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.5.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.5.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.5
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.5 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.5)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **ડિફોલ્ટ મોબાઇલ નંબર (0000000001):** ખાતાવહી તેમજ બર્થડે/એનિવર્સરી વિશિઝમાં ડિફોલ્ટ નંબર 0000000001 સેટ કરવામાં આવ્યો છે અને સીધો કાર્ડ પર બટન તરીકે દેખાશે.
            - **ખાતાવહી કાર્ડ સુંદર સિંગલ-લાઈન લેઆઉટ (Image 1):** ફોન નંબર, WhatsApp અને UPI QR હવે એક જ લાઈનમાં આવશે, અને નીચે તારીખ તથા પાકતી તારીખ પણ એક જ લાઈનમાં ગોઠવવામાં આવી છે.
            - **કામો/રીમાઇન્ડર નોંધ સળંગ (Continuous) લેઆઉટ (Image 2 & 3):** રિમાઇન્ડર અને ખરીદીની નોંધ હવે બટનો વચ્ચે દબાયા વગર પૂરી પહોળાઈમાં સળંગ આવશે જેથી ૪ લાઈનમાં તૂટી ન જાય અને વાંચવામાં એકદમ સુંદર લાગે.
            - **સુપરફાસ્ટ પર્ફોર્મન્સ અને સ્મૂધ કામગીરી.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.5.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.5.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
