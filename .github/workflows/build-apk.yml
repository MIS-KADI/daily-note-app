name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.45.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.45.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.45
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.45 Step Graph & Full Localization)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.45)

            આ નવા વર્ઝન v1.0.45 માં કરવામાં આવેલા મહત્વપૂર્ણ સુધારાઓ:
            - **📊 સાચો 7-દિવસનો વોકિંગ સ્ટેપ ગ્રાફ:** હવે ચાલેલા વાસ્તવિક સ્ટેપ મુજબ લાઈવ અપડેટ, ટૅપ કરીને દરેક દિવસની વિગતો, સ્ટેપ ગોલ પ્રીસેટ્સ અને રિસેટ વિકલ્પ સાથે.
            - **🔒 ખાલી UPI ID અને મોબાઈલ પ્લેસહોલ્ડર:** UPI ID તથા ફોર્મમાં ડિફોલ્ટ મોબાઈલ નંબર હટાવી બ્લેન્ક રાખવામાં આવ્યું છે.
            - **🌐 સંપૂર્ણ ગુજરાતી / હિન્દી / અંગ્રેજી ભાષા સપોર્ટ:** તમામ ટેબ, મોડલ, ચાર્ટ્સ, એલર્ટ્સ અને સ્કેનરમાં પસંદ કરેલી ભાષા મુજબ સુસંગત લખાણ.
            - **⚡ હોમ સ્ક્રીન પર સ્ટેપ્સ & પાણી ક્વિક ટ્રેકર:** સીધા હોમ ટેબમાંથી જ સ્ટેપ્સ અને પાણી ટ્રેક કરવાની સુવિધા.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.45.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.45.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
