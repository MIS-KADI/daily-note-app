name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.22.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.22.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.22
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.22 Beautiful New App Launcher Icon & Branding)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.22)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **✨ આકર્ષક અને પ્રીમિયમ એપ આઇકન (Stunning New App Launcher Icon):**
              - જૂનો ડિફોલ્ટ કેપેસિટર વાદળી આઇકન સંપૂર્ણપણે બદલી નાખવામાં આવ્યો છે.
              - હવે રોયલ મિડનાઇટ નેવી બ્લુ બેકગ્રાઉન્ડ પર ગોલ્ડન ફેધર કલમ (Quill), ચમકતા સોનેરી તારલા અને પ્રીમિયમ 3D ડેઇલી ડાયરી બુક સાથે અતિ આકર્ષક નવો આઇકન સેટ કર્યો છે.
              - ગોળ (Round), સ્ક્વિર્કલ (Squircle), અને એડેપ્ટિવ (Adaptive Foreground & Background) તમામ એન્ડ્રોઇડ ફોન સ્ક્રીન સાઇઝ (mdpi, hdpi, xhdpi, xxhdpi, xxxhdpi) માટે હાઇ-ડેફિનેશનમાં બનાવ્યો છે.
            - **🌟 નવો પ્રીમિયમ સ્પ્લેશ સ્ક્રીન (Branded Splash Screen):**
              - એપ ઓપન કરતી વખતે આવતી સ્પ્લેશ સ્ક્રીન પણ નવા ડાર્ક રોયલ નેવી અને ગોલ્ડન ડાયરી બ્રાન્ડિંગ સાથે સુંદર બનાવી દીધી છે.
            - **🚀 પરમિશન આપ્યા પછી સીધી ઍપ ઓપન થાય છે (Fixed Startup Flow):**
              - પરમિશન Allow કર્યા પછી સીધું સંપર્ક ડિરેક્ટરી ખૂલવાની જગ્યાએ સીધી એપની હોમ સ્ક્રીન જ ખૂલશે.
            - **👥 નેટિવ કોન્ટેક્ટ પીકર (Native Phone Contacts Picker) અને 24/7 સ્ટેપ ટ્રેકિંગ સર્વિસ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.22.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.22.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
