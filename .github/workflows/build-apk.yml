name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.15.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.15.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.15
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.15 Interactive Shopping Checklist & Demo Entries)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.15)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **ઇન્ટરેક્ટિવ ખરીદી યાદી / ચેકલિસ્ટ (Interactive Shopping Checklist):** નવી ખરીદી યાદી ઉમેર્યા પછી કાર્ડ પર માત્ર વિષય જ દેખાતો હતો અને ખરીદીની વિગત છુપાઈ જતી હતી તે બગ સંપૂર્ણ સોલ્વ કર્યો છે. હવે દરેક વસ્તુ ચેકબોક્સ સાથે સુંદર રીતે દેખાય છે અને તેના પર ક્લિક કરીને ટીક / અનટીક કરી શકાય છે.
            - **લાઈવ પ્રોગ્રેસ બાર:** કેટલી વસ્તુઓ ખરીદાઈ અને કેટલી બાકી છે તેનો ટકાવારી સાથેનો પ્રોગ્રેસ બાર કાર્ડ પર લાઈવ અપડેટ થશે.
            - **૩ નવી ડેમો ખરીદી એન્ટ્રીઓ (3 New Demo Shopping Entries):** કરિયાણું, શાકભાજી-ફળો અને ડેરી પ્રોડક્ટ્સની ૩ નવી ડેમો ચેકલિસ્ટ એન્ટ્રીઓ ઉમેરી આપી છે.
            - **વોટ્સએપ શેરિંગ અપગ્રેડ:** ખરીદીની આખી યાદી ચેકલિસ્ટ સાથે વોટ્સએપ પર એક જ ક્લિકથી શેર કરી શકાશે.
            - **સુપર લાઇટવેઇટ સાઈઝ (<8 MB) & સ્મૂથ વર્કિંગ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.15.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.15.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
