name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: daily-diary-v1.0.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.0)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK)

            આ APK ફાઇલ તમારા મોબાઇલમાં ઇન્સ્ટોલ કરવા માટે તૈયાર છે:
            - **એપ બંધ હોય તો પણ એલાર્મ વાગશે:** નેટિવ Android AlarmManager અને LocalNotifications સપોર્ટ.
            - **ઓફલાઈન મોડ:** ઇન્ટરનેટ વગર સંપૂર્ણ ડેટા સેવ થશે.
            - **વોકિંગ સ્ટેપ ટ્રેકિંગ:** મોશન સેન્સર સાથે આપોઆપ સ્ટેપ ગણતરી.
            - **દવાઓ & કામોના રીમાઇન્ડર:** હેડ્સ-અપ નોટિફિકેશન અને વાઇબ્રેશન.

            નીચે આપેલ **`daily-diary-v1.0.0.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: daily-diary-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
