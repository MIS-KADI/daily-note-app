name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.9.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.9.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.9
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.9 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.9)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ ડીપ ડાર્ક મોડ સુધારા:
            - **બેંક vs રોકડ અને ખાતાવહી લેતી-દેતી ચાર્ટ:** ડાર્ક મોડમાં બેંક/કેશ કાર્ડ્સ, મારે લેવાના/આપવાના બોક્સ અને પર્સેન્ટેજ બેજ સંપૂર્ણ હાઇ-કોન્ટ્રાસ્ટ અને તેજસ્વી બનાવ્યા.
            - **વાર મુજબ ખર્ચ વિશ્લેષણ ગ્રાફ:** ડાર્ક મોડમાં ગ્રાફના બાર ગાયબ થવાની સમસ્યા હલ કરી અને સૌથી વધુ ખર્ચવાળા દિવસનો ગ્રાફ વાઇબ્રન્ટ બનાવ્યો.
            - **મોશન સેન્સર કાર્ડ (હેલ્થ હબ & હોમ):** ડાર્ક મોડમાં કાર્ડનો બેકગ્રાઉન્ડ અને લખાણ એકદમ સ્પષ્ટ વંચાય તેવું સેટ કર્યું.
            - **ભાષાંતર સુધારો ("રોકડ સિલક" & "બધું જુઓ"):** `cash_balance` અને `view_all` ના અનટ્રાન્સલેટેડ લેબલ સુધારી શુદ્ધ ગુજરાતીમાં સેટ કર્યા.
            - **દવાઓનું રૂટિન & વોટર ટ્રેકર:** દરેક દવા કાર્ડ, "બાકી/લીધી" સ્ટેટસ બેજ અને વોટર ગ્લાસ બંને મોડમાં સ્ફટિક સ્પષ્ટ દેખાશે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.9.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.9.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
