name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.20.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.20.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.20
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.20 Native Contact Picker, Background Step Tracker, Photo Filters & Collage)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.20)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **👥 નેટિવ કોન્ટેક્ટ પીકર (Native Phone Contacts Picker):**
              - ખાતાવહી (Khata) અને ઇમરજન્સી મોડલમાં સીધા ફોનના સંપર્કોમાંથી પસંદગી.
              - પાર્ટીનું નામ અને ૧૦-અંકનો મોબાઈલ નંબર ઓટોમેટિક ભરાઈ જશે.
            - **👟 બેકગ્રાઉન્ડ સ્ટેપ કાઉન્ટર સર્વિસ (Background Step Tracking 24/7):**
              - ઍપ બંધ હોય તો પણ સ્ટેપ સતત ગણાતા રહેશે (`StepService`).
              - હાર્ડવેર ચિપ (`TYPE_STEP_COUNTER`) અને એકસેલરોમીટર ફોલબેક દ્વારા દરેક મોબાઈલમાં ૧૦૦% કામ કરશે.
              - દરરોજ મધ્યરાત્રિએ (Midnight) ઓટોમેટિક રીસેટ.
            - **🚨 કસ્ટમ ઇમરજન્સી નંબરો (Add/Remove Custom Emergency Numbers):**
              - પોતાના પરિવાર/મિત્ર/ડૉક્ટરના નંબરો ઉમેરવા અને કાઢી નાખવાની સુવિધા.
              - ૧-ક્લિકમાં ડાયલિંગ અને રાષ્ટ્રીય હેલ્પલાઇન (108, 112, 1930, 101, Bank).
            - **📸 ફોટો ગેલેરી સુધારા + ફિલ્ટર્સ + કોલાઝ મેકર (Filters & Collage Maker):**
              - મોબાઈલ સ્ક્રીન માટે રિસ્પોન્સિવ હેડર જે ક્યારેય કપાતું નથી.
              - ફેવરિટ ફોટા ઉમેરતી વખતે આપોઆપ પરિવારમાં જવાની ક્ષતિ દૂર થઈ.
              - ૮ જબરદસ્ત ફોટો ફિલ્ટર્સ (વિન્ટેજ, B&W, વાર્મ, કૂલ, સેપિયા, વાઇબ્રન્ટ) + Canvas સેવ.
              - ફોટો કોલાઝ મેકર (૨ થી ૪ ફોટા જોડીને સ્પ્લિટ/ગ્રીડ કોલાઝ બનાવવાની સુવિધા).
            - **✨ હોમ સ્ક્રીન ૪ x ૨ બેલેન્સ્ડ ગ્રીડ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.20.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.20.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
