name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.21.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.21.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.21
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.21 Permission Flow Fix & Clean Startup)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.21)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **🚀 પરમિશન આપ્યા પછી સીધી ઍપ ઓપન થાય છે (Fixed Startup Flow):**
              - ઍપ ઇન્સ્ટોલ કે ઓપન કરતી વખતે પરમિશન Allow કર્યા પછી સીધું સંપર્ક ડિરેક્ટરી ખૂલી જવાની સમસ્યા સંપૂર્ણ ફિક્સ કરી દીધી છે.
              - હવે પરમિશન આપ્યા પછી સીધી એપની હોમ સ્ક્રીન જ ખૂલશે.
              - સંપર્ક ડિરેક્ટરી માત્ર ત્યારે જ ખૂલશે જ્યારે તમે ખાતાવહી કે ઇમરજન્સીમાં 'સંપર્કમાંથી પસંદ કરો' બટન દબાવશો.
            - **👥 નેટિવ કોન્ટેક્ટ પીકર (Native Phone Contacts Picker):**
              - ખાતાવહી (Khata) અને ઇમરજન્સી મોડલમાં સીધા ફોનના સંપર્કોમાંથી પસંદગી અને નામ-નંબર ઓટો-ફિલ.
            - **👟 બેકગ્રાઉન્ડ સ્ટેપ કાઉન્ટર સર્વિસ (Background Step Tracking 24/7):**
              - ઍપ બંધ હોય તો પણ સ્ટેપ સતત ગણાતા રહેશે (`StepService`).
            - **🚨 કસ્ટમ ઇમરજન્સી નંબરો (Add/Remove Custom Emergency Numbers).**
            - **📸 ફોટો ગેલેરી સુધારા + ૮ ફિલ્ટર્સ + કોલાઝ મેકર.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.21.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.21.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
