name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.16.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.16.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.16
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.16 Clean UI, Health Hub Water Tracker & Privacy Policy)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.16)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **આરોગ્ય વિભાગમાં ફિટનેસ અને વોટર ટ્રેકર (Health Hub):** હોમ પેજ પરથી ફિટનેસ અને વોટર ટ્રેકર હટાવીને સીધા હેલ્થ વિભાગમાં લઈ લીધા છે.
            - **હોમ ટેબમાંથી ડાયરી સેક્શન રિમૂવ:** ડાયરીનું અલગ ટેબ હોવાથી હોમ પેજ પરથી ડાયરી પ્રિવ્યુ હટાવી દીધો છે.
            - **ડાયરીમાં તારીખ સિલેક્ટ કરીને નવી નોંધ ઉમેરવાનું ફિક્સ:** કેલેન્ડર કે તારીખ ફિલ્ટરમાંથી કોઈપણ તારીખ સિલેક્ટ કરતી વખતે સીધું "આ તારીખે નવી નોંધ લખો" નું પ્રમોટ બટન ઉપલબ્ધ કર્યું.
            - **અનાવશ્યક વિગતો દૂર:**
              1. અગાઉની યાદગાર ક્ષણ (Throwback Memory) કાર્ડ અને પોપઅપ રિમૂવ કર્યું.
              2. એડવાન્સ નોંધો (Advance Notes) ફિલ્ટર અને કાઉન્ટ રિમૂવ કર્યું.
              3. નોંધ લખતી વખતે મૂડ સિલેક્ટર (Today's Mood) રિમૂવ કર્યું.
              4. કીબોર્ડ & માત્રા સહાયક (Keyboard Helper) બટન અને ડ્રોઅર રિમૂવ કર્યું.
            - **પ્રોફાઇલ ટેબમાં પ્રાઇવસી પોલિસી (Privacy Policy):** ૧૦૦% ઓફલાઇન, લોકલ સ્ટોરેજ અને ડેટા સિક્યોરિટીની સંપૂર્ણ પ્રાઇવસી પોલિસી કાર્ડ અને મોડલ ઉમેરી આપ્યા છે.
            - **અલ્ટ્રા લાઇટવેઇટ સાઈઝ (<8 MB) & સ્મૂથ ફાસ્ટ પર્ફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.16.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.16.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
