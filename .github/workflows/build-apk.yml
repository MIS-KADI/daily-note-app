name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.34.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.34.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.34
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.34 Direct Live Camera Scanner, Google Drive Auto-Sync, Eye Workout & Vision Care)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.34)

            આ નવા વર્ઝન v1.0.34 માં કરવામાં આવેલા તમામ ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **📷 PDF સ્કેનરમાં ડાયરેક્ટ લાઇવ કેમેરા વ્યૂફાઇન્ડર (Direct Live Camera Scanner):**
              - 'કેમેરાથી સ્કેન કરો' પર ક્લિક કરતાં ગેલેરી ખુલવાની સમસ્યા સંપૂર્ણપણે દૂર. હવે સ્ક્રીન પર સીધો જ લાઇવ રિયર કેમેરો સ્ટ્રીમ થાય છે.
              - દસ્તાવેજ (A4 / Bill) અને ઓળખપત્ર (ID Card) માટે ગ્લોઇંગ કોર્નર્સ અને ગાઇડ ફ્રેમ સાથે સચોટ ફોટો કેપ્ચર.
              - શટર બટન (📸 ફોટો પાડો), ફ્લેશલાઇટ/ટોર્ચ ટૉગલ (⚡) અને કેમેરા ફ્લિપ (🔄 આગળ/પાછળ).
            - **☁️ Google Drive ઓટો-સિંક (Google Drive Cloud Auto-Sync System):**
              - પ્રોફાઇલમાં સમર્પિત 'Google Drive ઓટો-સિંક' કાર્ડ અને લાઇવ ઓટો-સિંક ટૉગલ સ્વિચ.
              - નોંધો, હિસાબ, કામો અને દવાઓ આપમેળે Google Drive ફોર્મેટમાં બેકઅપ થઈ જાય છે.
              - ૧-ક્લિકમાં ડાયરેક્ટ Google Drive સાથે ક્લાઉડ સિંક અને ગૂગલ ડ્રાઇવ ઓપન કરવાની સુવિધા.
            - **👀 આંખોની કસરત & નેત્ર યોગ ટ્રેનર (Interactive Eye Workout & Vision Care):**
              - હેલ્થ & ફિટનેસમાં નવું '👀 આંખોની કસરત' સબ-ટેબ.
              - ૬૦ FPS સ્મૂધ એનિમેટેડ ઓર્બ સાથે:
                1. ગોળ આંખો ફેરવવી (Circular Eye Rolling)
                2. આઠડા આકારની ગતિ (Figure 8 / Infinity ∞ Tracking)
                3. નજીક અને દૂર ફોકસ (Near-Far Depth Focus)
                4. ઝડપી પલકારો (Blink Pacer - કુદરતી આંસુ/ભેજ માટે)
                5. પામિંગ & હૂંફાળો વિશ્રામ (Palming Relaxation)
                6. સંપૂર્ણ ૨-મિનિટ માર્ગદર્શિત વર્કઆઉટ અને ઓડિયો ચાઇમ્સ.
              - ૨૦-૨૦-૨૦ સ્ક્રીન બ્રેક ટાઇમર અને આયુર્વેદિક નેત્ર કાળજી માર્ગદર્શન.
            - **💵 ચુકવણી મોડ ડ્રોપ-ડાઉન (Payment Mode Dropdown with Cash First):**
              - વધારાના બટનો હટાવીને સ્વચ્છ ડ્રોપ-ડાઉન રાખવામાં આવ્યું છે.
              - પ્રથમ વિકલ્પ **'રોકડ (Cash)'** રાખવામાં આવ્યો છે, ત્યારબાદ UPI, બેંક ટ્રાન્સફર અને કાર્ડ્સ.
            - **⚡ અલ્ટ્રા-સ્પીડ પર્ફોર્મન્સ & સ્મૂધનેસ (Fast & Smooth 60FPS):**
              - સુપર ઓપ્ટિમાઇઝ્ડ રેન્ડરિંગ જેથી આખી એપ એકદમ સ્પીડ અને માખણ જેવી સ્મૂધ ચાલે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.34.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.34.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
