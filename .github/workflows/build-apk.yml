name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.35.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.35.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.35
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.35 Strict 100% Online Enforcement, Clean Profile UI)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.35)

            આ નવા વર્ઝન v1.0.35 માં કરવામાં આવેલા મહત્વના સુધારાઓ:
            - **🌐 ૧૦૦% ઓનલાઇન મોડ કડક રીતે લાગુ (Strict 100% Online-Only Enforcement):**
              - જો ઇન્ટરનેટ / મોબાઇલ ડેટા / Wi-Fi ચાલુ ન હોય તો એપ કોઈ પણ સંજોગોમાં ઓપન થશે નહીં.
              - પૂર્ણ-સ્ક્રીન અનબાયપાસેબલ ગેટકીપર સ્ક્રીન (**ઇન્ટરનેટ કનેક્શન જરૂરી છે**):
                - રેડ/એમ્બર પલ્સિંગ બીકન અને `WifiOff` એનિમેટેડ આઇકન.
                - ગુજરાતી, હિન્દી અને અંગ્રેજીમાં સ્પષ્ટ સૂચના.
                - '🔄 ફરી પ્રયાસ કરો (Retry Connection)' લાઈવ ચકાસણી બટન.
                - બેકગ્રાઉન્ડ ઓટો-ડિટેક્શન: ફોનમાં નેટ ચાલુ થતાં જ એપ ૧ સેકન્ડમાં આપમેળે ખુલી જશે!
            - **🧹 પ્રોફાઇલ કાર્ડ સાફ કર્યું (Clean Profile UI):**
              - યુઝરની માંગણી મુજબ "ઈમેલ ઓટો-બેકઅપ & સિંક" ડાર્ક કાર્ડ પ્રોફાઇલમાંથી સંપૂર્ણપણે હટાવી લીધું છે.
              - પ્રોફાઇલ હેડરમાં 'સ્વિચ' અને 'લૉગઆઉટ' ના સ્વચ્છ બટન રાખવામાં આવ્યા છે જેથી એકાઉન્ટ મેનેજમેન્ટ સરળ રહે.
            - **⚡ અલ્ટ્રા-સ્પીડ & સ્મૂધ 60FPS ઓપ્ટિમાઇઝેશન:**
              - કોઈ લેગ વગર તમામ ટેબ્સ અને ફીચર્સ સ્મૂધલી કામ કરશે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.35.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.35.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
