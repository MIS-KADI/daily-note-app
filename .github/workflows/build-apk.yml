name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.33.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.33.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.33
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.33 Auto-Fit Crop & 2-in-1 ID Card Front/Back Single Page Scanner)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.33)

            આ નવા વર્ઝન v1.0.33 માં કરવામાં આવેલા તમામ ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **✂️ ઓટો-ફીટ & ઇન્ટરેક્ટિવ ક્રોપ ટૂલ (Smart Auto-Fit & Document Border Crop):**
              - સ્કેન કરેલ દસ્તાવેજ કે ફોટાની આસપાસની ટેબલ કે વધારાની બોર્ડર આપોઆપ ઓળખીને ક્રોપ કરવા માટે 'ઓટો ડિટેક્ટ' સુવિધા.
              - ઇન્ટરેક્ટિવ ટચ/માઉસ ક્રોપ બોક્સ, ૪ ખૂણાના હેન્ડલ્સ અને રૂલ-ઓફ-થર્ડ્સ ગ્રીડ સાથે સચોટ ક્રોપિંગ.
              - ઝડપી પ્રીસેટ્સ: 'ઓટો ફીટ ✨', 'A4 પાનું 📄', 'ID કાર્ડ (3:2) 🪪', '૧:૧ ચોરસ 🔲' અને 'સંપૂર્ણ 🌟'.
            - **🪪 આઈડી કાર્ડ ૨-ઇન-૧ સ્કેનર - આગળ & પાછળ ૧ જ પેજ પર (ID Card & Driving License Front/Back on Single Page):**
              - ડ્રાઇવિંગ લાઇસન્સ, આધાર કાર્ડ, ચૂંટણી કાર્ડ, પાન કાર્ડ કે ઓફિસ આઈડી કાર્ડ માટે સ્પેશિયલ ૨-ઇન-૧ સ્કેન મોડ.
              - આગળની બાજુ (Front) અને પાછળની બાજુ (Back) અલગ-અલગ કેમેરાથી સ્કેન અથવા ગેલેરીમાંથી અપલોડ કરો.
              - બંને બાજુઓને આપમેળે **એક જ સિંગલ A4 પેજ પર ઉપર અને નીચે સપ્રમાણ ગોઠવીને (Composite Single Page)** સુંદર બોર્ડર સાથે પ્રદર્શિત કરે છે.
              - લાઇવ A4 પ્રિન્ટ પ્રિવ્યૂ અને ૧-ક્લિકમાં સિંગલ-પેજ PDF અથવા JPG ફોટો ડાઉનલોડ & શેર કરવાની સુવિધા.
            - **⚡ હાઇ સ્પીડ કેન્વાસ એન્જિન (Fast & Smooth 60FPS Performance):**
              - પ્યોર HTML5 કેન્વાસ પ્રોસેસિંગ વડે કોઈપણ લેગ વગર સુપર ફાસ્ટ અને સ્મૂધ કામગીરી.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.33.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.33.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
