name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.42.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.42.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.42
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.42 Profile Fix, Clean Home & Fresh Start)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.42)

            આ નવા વર્ઝન v1.0.42 માં કરવામાં આવેલા મહત્વપૂર્ણ સુધારાઓ:
            - **🛠️ PROFILE ટેબ સંપૂર્ણ ફિક્સ (Profile Tab Crash Fixed):**
              - પ્રોફાઇલ ટેબમાં કંઈ દેખાતું નહોતું તે સમસ્યા કાયમ માટે ઉકેલી દેવાઈ છે. પ્રોફાઇલ પેજ, માહિતી, ફિંગરપ્રિન્ટ/PIN સુરક્ષા અને સેટિંગ્સ એકદમ યોગ્ય રીતે ખૂલે છે.
            - **✨ હોમ સ્ક્રીન ક્લીન અને ઓનલાઈન/ઓફલાઈન ઈન્ડિકેટર મુક્ત (Clean Home & Header):**
              - યુઝરની વિનંતી અનુસાર હેડરમાંથી ઓનલાઇન / ઓફલાઇન બેજ અને બેનર દૂર કરવામાં આવ્યા છે જેથી સ્ક્રીન એકદમ સાફ અને આકર્ષક લાગે.
            - **🧹 ડિફોલ્ટ એન્ટ્રીઓ દૂર - સંપૂર્ણ ફ્રેશ શરૂઆત (Fresh Data & Clean Slate):**
              - તમામ જૂની નમૂના/ડેમો એન્ટ્રીઓ (નોટ્સ, રિમાઇન્ડર્સ, દવાઓ, હિસાબ) દૂર કરી દેવામાં આવી છે.
              - હવે તમે તમારી પોતાની નવી ફ્રેશ નોંધ, હિસાબ અને રીમાઇન્ડર્સ શરૂઆતથી ઉમેરી શકો છો. પ્રોફાઇલમાં સમર્પિત 'ડિફોલ્ટ એન્ટ્રીઓ સાફ કરો' બટન પણ આપેલ છે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.42.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.42.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
