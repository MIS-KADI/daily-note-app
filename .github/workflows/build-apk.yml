name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.36.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.36.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.36
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.36 PDF Export Fixed, Clean UI Arrangement, 100% Online)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.36)

            આ નવા વર્ઝન v1.0.36 માં કરવામાં આવેલા મહત્વના સુધારાઓ:
            - **📄 PDF સ્કેન અને ડાઉનલોડ ક્ષતિ સોલ્વ (PDF Fix):**
              - એન્ડ્રોઇડ ફોનમાં PDF બનાવતી વખતે આવતી "PDF બનાવવામાં ક્ષતિ આવી" એરર કાયમ માટે સોલ્વ કરવામાં આવી છે.
              - નેટિવ કેપેસિટર ફાઇલસિસ્ટમ અને શેર API દ્વારા સુરક્ષિત ડાઉનલોડ અને શેરિંગ.
              - ૨-ઇન-૧ આઇડી કાર્ડ સ્કેન અને એક્સપોર્ટ પણ એકદમ પરફેક્ટ અને સ્મૂધ.
            - **🎨 રિમાઇન્ડર અને દૈનિક ડાયરીનું સુંદર એરેન્જમેન્ટ (Clean & Modern UI):**
              - **રિમાઇન્ડર્સ ટેબ (Image 2):** વિશાળ બોક્સ હટાવીને સિંગલ-રો મેટ્રિક્સ પટ્ટી અને સુવ્યવસ્થિત ફિલ્ટર પેનલ.
              - **નોંધો ટેબ (Image 3):** સર્ચ બોક્સ, તારીખ ફિલ્ટર અને કેટેગરી ચિપ્સને એક જ સુંદર, કોમ્પેક્ટ કાર્ડમાં ગોઠવવામાં આવ્યા જેથી નોંધો વાંચવા માટે વધારે જગ્યા મળે.
              - ભાષા બદલતી વખતે દેખાતી `pinned_notes` ની ખામી સુધારી લેવાઈ છે (હવે ગુજરાતીમાં 'પિન કરેલી' અને હિન્દીમાં 'पिन की गई' દેખાશે).
            - **🌐 ૧૦૦% ઓનલાઇન નેટ કનેક્શન જરૂરી (Strict Online-Only):**
              - જો ફોનમાં ઈન્ટરનેટ/ડેટા ન હોય તો એપ કોઈ પણ સંજોગોમાં ઓપન થશે નહીં.
              - લાઈવ રિયલ ગૂગલ સર્વર પિંગ્સ અને ફાસ્ટ ઓટો-રિકવરી.
            - **⚡ અલ્ટ્રા-સ્પીડ & સ્મૂધ રિસ્પોન્સિવ અનુભવ:**
              - કોઈપણ પ્રકારના હેંગ કે લેગ વગર 60fps સ્મૂધ કાર્યક્ષમતા.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.36.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.36.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
