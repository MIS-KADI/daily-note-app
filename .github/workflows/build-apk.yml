name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.14.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.14.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.14
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.14 Fix AI Assistant Save & Smart Intent Parsing)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.14)

            આ નવા વર્ઝનમાં કરવામાં આવેલા અતિ મહત્વના સુધારા:
            - **સ્માર્ટ આસિસ્ટન્ટ સેવ ફિક્સ (100% Fixed Save Issue):** AI આસિસ્ટન્ટમાંથી બોલીને કે ટાઈપ કરીને એન્ટ્રી (જેમ કે ખરીદી, ખર્ચ, રીમાઇન્ડર વગેરે) સેવ કરતી વખતે જે સેવ નહોતું થતું તેનો રિકર્સન બગ શોધીને સંપૂર્ણ સોલ્વ કરી દેવામાં આવ્યો છે. હવે `હા, સેવ કરો` બટન દબાવતા જ તરત જ ડાયરી અને સંબંધિત ટેબમાં સેવ થઈ જાય છે.
            - **સ્માર્ટ ઈન્ટેન્ટ અને ટફન ગ્લાસ / ગેજેટ્સ કેટેગરી અપગ્રેડ:** 'ટફન ગ્લાસ' કે 'મોબાઈલ કવર' જેવા શબ્દો હવે પાણી પીવાના ગ્લાસ સાથે મિક્સ નહીં થાય અને ખર્ચમાં 'મોબાઈલ / ગેજેટ્સ / રિચાર્જ' કે ખરીદીમાં એકદમ સચોટ રીતે ઓળખાશે.
            - **ઝડપી અને સ્મૂથ વર્કિંગ:** એપ એકદમ સ્મૂથ, ફાસ્ટ અને બેટરી ફ્રેન્ડલી કામ કરશે.
            - **સુપર લાઇટવેઇટ સાઈઝ (<8 MB).**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.14.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.14.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
