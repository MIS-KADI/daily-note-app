name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.13.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.13.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.13
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.13 Fix Motion Vibration & Sensor Optimization)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.13)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **મોબાઈલ વાઇબ્રેશન સંપૂર્ણ બંધ (Eliminated Motion Vibration):** ફોન હાથમાં પકડતાં કે આઘો-પાછો કરતાં જે વાઇબ્રેટ થતું હતું તે સોફ્ટવેર એક્સીલેરોમીટર વાઇબ્રેશન કોડ કાયમ માટે કાઢી નાખ્યો છે. સ્ટેપ્સ હવે સંપૂર્ણ સાયલન્ટ અને સ્મૂથ ગણાશે.
            - **નેટિવ હાર્ડવેર સેન્સર ઓપ્ટિમાઇઝેશન:** ફોનના હાર્ડવેર સેન્સર હબ દ્વારા બેકગ્રાઉન્ડમાં ઓરિજિનલ સ્ટેપ્સ ગણવાનું ચાલુ રહેશે અને કોઈ ખોટા ફોલ્સ-વાઇબ્રેશન કે બેટરી ડ્રેઇન થશે નહીં.
            - **સુપર લાઇટવેઇટ સાઈઝ (<8 MB).**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.13.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.13.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
