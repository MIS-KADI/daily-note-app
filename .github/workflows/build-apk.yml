name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.18.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.18.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.18
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.18 Favorite Photo Gallery & Memories Vault)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.18)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **📸 નવી યાદગાર ફોટો ગેલેરી અને ફેવરિટ તસવીરો (Favorite Photo Gallery & Vault):** 
              - મોબાઇલ ગેલેરીમાંથી પરિવાર, પ્રવાસ કે અંગત યાદગાર ફોટા પસંદ કરી સાચવવાની ઉત્તમ સુવિધા.
              - **⭐ ૧-ટેપ ફેવરિટ માર્કિંગ:** કોઈપણ ફોટાને સરળતાથી ફેવરિટ બનાવી અલગ ફિલ્ટરથી જોઈ શકાય છે.
              - **સ્માર્ટ ઈમેજ કમ્પ્રેશન:** મોટા ફોટા (5-10 MB) ગુણવત્તા બગાડ્યા વગર ઓટો-ઓપ્ટિમાઈઝ થઈ માત્ર ~100-150 KB માં સેવ થાય છે, જેથી ફોન સ્લો ન થાય કે સ્ટોરેજ ભરાય નહીં.
              - **આલ્બમ & કેટેગરીઝ:** પરિવાર (Family), પ્રવાસ (Travel), પ્રસંગો (Events), પર્સનલ (Personal), દસ્તાવેજ (Docs).
              - **ફુલ-સ્ક્રીન લાઈટબોક્સ વ્યુઅર:** ફોટો મોટો કરીને જોવો, નેક્સ્ટ/પ્રિવિયસ, ટાઇટલ એડિટ, ડાઉનલોડ, શેર અને ડિલીટ કરવાના સંપૂર્ણ કંટ્રોલ્સ.
              - **૧૦૦% ઓફલાઇન & પ્રાઇવેટ:** તમામ તસવીરો તમારા જ ફોનમાં સુરક્ષિત રહે છે.
            - **અલ્ટ્રા લાઇટવેઇટ સાઈઝ (<8 MB) અને સ્મૂથ ફાસ્ટ પર્ફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.18.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.18.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
