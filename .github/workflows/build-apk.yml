name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.28.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.28.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.28
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.28 Task, SMS Parser & Contact Picker Fixes)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.28)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ ઊંડાણપૂર્વકના સુધારા:
            - **📝 રીમાઇન્ડર/કામ એડ કરવાનો પ્રશ્ન ઉકેલાયો (Add Task Issue Fixed):**
              - "+ નવું કામ" બટન દબાવતાં તરત જ વિન્ડો ખૂલે છે (હવે કોઈ અટકાવ કે લૂપ નથી).
              - "no_tasks_sub" વાળી ટેક્સ્ટ સાચી ગુજરાતી ભાષામાં સુધારી દેવાઈ છે.
              - સ્ક્રીન પર નીચે નવું ઝડપી 1-ટેપ એક્શન બટન (FAB) પણ ઉમેરાયું છે.
            - **💳 બેંક SMS ઓટો-ખર્ચ સુધારો (Bank SMS Parser Overhaul):**
              - "BOB 150 DR" જેવા ટૂંકા મેસેજમાંથી પણ રકમ (₹150) તરત પકડી લે છે.
              - રકમ (Amount), કેટેગરી (Category), ખાતું/બેંક અને પ્રકાર (ખર્ચ/આવક) બધું જ એડિટ કરી શકાય છે.
              - "આ એન્ટ્રી હિસાબમાં ઉમેરો" ક્લિક કરતાની સાથે જ હિસાબ ટેબમાં રેકોર્ડ સેવ થઈ જાય છે.
            - **🎂 જન્મદિવસ અને એનિવર્સરીમાં કોન્ટેક્ટ સિલેક્શન (Contact Picker Added):**
              - નવો જન્મદિવસ કે એનિવર્સરી ઉમેરતી વખતે "📱 ફોનમાંથી સંપર્ક પસંદ કરો" બટન દ્વારા સીધા તમારા મોબાઈલ કોન્ટેક્ટ લિસ્ટમાંથી નામ અને મોબાઈલ નંબર ઓટોમેટિક ભરાઈ જાય છે.
            - **⚡ સુપર સ્મૂથ અને અલ્ટ્રા ફાસ્ટ પરફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.28.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.28.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
