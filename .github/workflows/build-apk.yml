name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.32.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.32.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.32
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.32 Email Auto-Backup, Continuous Sync, Multi-Account Login/Logout)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.32)

            આ નવા વર્ઝન v1.0.32 માં કરવામાં આવેલા તમામ ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **☁️ ઈમેલ-આધારિત સંપૂર્ણ ઓટો-બેકઅપ સીસ્ટમ (Email-Linked Auto-Backup & Continuous Sync):**
              - પ્રોફાઈલમાં દાખલ કરેલ અથવા સાઈન અપ વખતે આપેલ Email ID સાથે સમગ્ર એપનો ડેટા (ડાયરીની નોંધો, રિમાઇન્ડર્સ, આવક-ખર્ચ, ખાતાવહી, દવાઓ, ઉત્સવો, હેલ્થ/ફિટનેસ અને સેટિંગ્સ) આપમેળે સતત ઓટો-સિંક થાય છે.
              - LocalStorage સાથે IndexedDB ડ્યુઅલ-લેયર બેકઅપ આર્કિટેક્ચર, જેનાથી કોઈ ડેટા લોસ થતો નથી.
            - **🔐 લૉગિન અને લૉગઆઉટ પર જૂનો ડેટા પુનઃપ્રાપ્તિ (Seamless Login & Logout with Data Restoration):**
              - **લૉગઆઉટ કરતી વખતે:** વર્તમાન યુઝરનો તમામ તાજો ડેટા ઈમેલ સ્ટોરમાં આપમેળે સેવ થાય છે અને સેશન સુરક્ષિત રીતે ક્લીયર થાય છે.
              - **લૉગિન કરતી વખતે:** ઈમેલ દાખલ કરતા જ અગાઉનો તમામ બેકઅપ ડિટેક્ટ થાય છે અને ૧-ટેપમાં તમામ જૂની નોંધો, હિસાબ અને કામો તુરંત પાછા રિસ્ટોર થઈ જાય છે.
            - **👥 મલ્ટી-એકાઉન્ટ સ્વિચિંગ (Saved Accounts on Device):**
              - ઉપકરણમાં સેવ થયેલા એકાઉન્ટ્સની યાદીમાંથી કોઈપણ એકાઉન્ટમાં ૧-ક્લિકમાં સ્વિચ કરી શકાય છે.
            - **🔄 હમણાં સિંક કરો (Instant Manual Sync & Snapshots History):**
              - પ્રોફાઇલ ટેબમાં લાઈવ ઓટો-સિંક બેજ, છેલ્લો સિંક થયેલો સમય, "હમણાં સિંક કરો" બટન અને પાછલા ૫ બેકઅપ સ્નેપશોટની હિસ્ટ્રી સાથે ૧-ક્લિક રોલબેક/રિસ્ટોર સુવિધા.
            - **🌐 નેટવર્ક સ્ટેટસ અને ઝડપી ઍક્સેસ:**
              - નેવબારમાં યુઝર એકાઉન્ટ ચિપ જેના પરથી ગમે ત્યારે લૉગિન/સાઇન અપ/સ્વિચ કરી શકાય છે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.32.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.32.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
