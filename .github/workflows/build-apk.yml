name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.30.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.30.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.30
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.30 SMS Balance Sync & 3-Language Instant Translation)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.30)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **💰 SMS દ્વારા ખર્ચ/આવક એન્ટ્રી અને સિલક (બેલેન્સ) સચોટ સિંક (100% Reliable SMS Balance Sync):**
              - SMS થી ઉમેરેલ દરેક એન્ટ્રી (ખર્ચ કે આવક) બેંક કે રોકડ સિલકમાં ૧૦૦% ચોકસાઈ સાથે અસર કરે છે (ડેબિટ થતાં બેલેન્સ ઘટે છે, ક્રેડિટ થતાં બેલેન્સ વધે છે).
              - કોઈ પણ એન્ટ્રી છૂટી જતી નથી અને બેલેન્સ આપોઆપ રિયલ-ટાઇમમાં અપડેટ થાય છે.
            - **🌐 માત્ર ૩ પવિત્ર મુખ્ય ભાષાઓ (Gujarati, Hindi, English Only):**
              - એપ્લિકેશનમાંથી સ્પેનિશ, ફ્રેન્ચ, જર્મન, અરબી જેવી બિનજરૂરી વિદેશી ભાષાઓ દૂર કરી ફક્ત ૩ મુખ્ય ભાષાઓ રાખી છે: **ગુજરાતી (Default)**, **हिन्दी** અને **English**.
              - કોઈ પણ ભાષા સિલેક્ટ કરતાં જ આખી એપ્લિકેશનનું તમામ લખાણ (બટન્સ, ટેબ્સ, કેટેગરી, હેલ્થ ટિપ્સ, મેસેજીસ વગેરે) તાત્કાલિક તે જ ભાષામાં બદલાઈ જાય છે.
            - **🫁 ફેફસાં મજબૂત કરવાની કસરતો અને બ્રિધિંગ ટ્રેનર:**
              - ૪-૭-૮ પદ્ધતિ, બોક્સ બ્રિધિંગ, અનુલોમ-વિલોમ અને ફેફસાં ક્ષમતા ટેસ્ટ (Breath Hold Test) ત્રણેય ભાષાઓમાં સંપૂર્ણ ઉપલબ્ધ.
            - **👥 સંપર્ક પસંદગી (Contact Picker):**
              - જન્મદિવસ અને એનિવર્સરીમાં ફોનબુકમાંથી સીધું નામ અને નંબર સિલેક્ટ કરવાની સુવિધા.
            - **⚡ સુપર સ્મૂથ અને અલ્ટ્રા ફાસ્ટ લૉન્ચ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.30.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.30.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
