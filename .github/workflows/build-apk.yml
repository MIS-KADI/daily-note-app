name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.19.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.19.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.19
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.19 Photos & Contacts Access with Privacy Vault)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.19)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **📸 ફોટો & મીડિયા ઍક્સેસ પરવાનગી (Photos & Media Access):**
              - Android 13/14+ (`READ_MEDIA_IMAGES`) અને જૂના વર્ઝન (`READ_EXTERNAL_STORAGE`) માટે યોગ્ય રનટાઈમ પરવાનગી વ્યવસ્થા.
              - **🔒 પ્રાઇવેટ ફોટો વોલ્ટ લૉક (PIN & Biometric Lock):** ફોટો ગેલેરીને તમારા અંગત 4-અંકના PIN અથવા ફિંગરપ્રિન્ટથી લૉક રાખવાની સુવિધા.
            - **👥 સંપર્કો ઍક્સેસ પરવાનગી (Contacts Access Permission):**
              - Android `READ_CONTACTS` પરવાનગી અને 1-ટેપ કોન્ટેક્ટ પીકર.
              - ખાતાવહી (Khata) માં પાર્ટી ઉમેરતી વખતે સીધા તમારા ફોનના સંપર્કોમાંથી નામ અને મોબાઈલ નંબર પસંદ કરવાની સુવિધા.
            - **🛡️ પ્રાઇવેટ & ૧૦૦% ઓફલાઇન સિક્યોરિટી ગેરંટી (Privacy & Security Guarantee):**
              - ફોટા કે સંપર્કો ક્યારેય કોઈ બહારના સર્વર પર અપલોડ થતા નથી.
              - કોઈ ત્રીજી વ્યક્તિ સાથે ડેટા શેર થતો નથી (Zero Cloud Sync, 100% Local).
              - પરવાનગીઓ મોડલ (`MobilePermissionsModal`) અને પ્રાઇવસી પોલિસીમાં સંપૂર્ણ સ્પષ્ટતા.
            - **અલ્ટ્રા લાઇટવેઇટ સાઈઝ (<8 MB) અને સ્મૂથ ફાસ્ટ પર્ફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.19.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.19.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
