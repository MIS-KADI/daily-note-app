name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.7.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.7.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.7
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.7 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.7)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **બધી ભાષામાં ડાયનેમિક ડેમો ડેટા ટ્રાન્સલેશન:** ભાષા સિલેક્ટ કરતાં જ એપની તમામ નમૂનાની એન્ટ્રીઓ (નોંધ, કામો, રીમાઇન્ડર, દવાઓ, હિસાબ, ખાતાવહી, ઉત્સવો) આપોઆપ પસંદ કરેલી ભાષા મુજબ થઈ જશે.
            - **હાઇલાઇટ થયેલ "ડેમો ડેટા હટાવો" બટન:** એપ ઓપન કરતાં જ સૌથી ઉપર એક ચમકતું, આકર્ષક બટન મૂકવામાં આવ્યું છે જે ૧-ક્લિકમાં તમામ ડેમો ડેટા સાફ કરી તમારી નવી ડાયરી શરૂ કરવા દેશે.
            - **ડેમો મોડ લોક પ્રોટેક્શન:** જ્યાં સુધી યુઝર ડેમો ડેટા ક્લિયર ના કરે ત્યાં સુધી ડેમો ડેટા સુરક્ષિત રહેશે અને નવી એન્ટ્રી કરતી વખતે તરત જ ડેમો ડેટા ક્લિયર કરી આગળ વધવાનું પૂછવામાં આવશે.
            - **પ્રોફાઇલમાંથી ડેમો ડેટા પુનઃસ્થાપિત:** જરૂર પડે તો પ્રોફાઇલ ટેબમાંથી ગમે ત્યારે ડેમો ડેટા ફરીથી ચાલુ પણ કરી શકાય છે.
            - **સુપરફાસ્ટ પર્ફોર્મન્સ અને સ્મૂધ યુઝર એક્સપિરિયન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.7.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.7.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
