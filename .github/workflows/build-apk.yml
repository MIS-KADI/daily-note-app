name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.17.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.17.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.17
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.17 Dark/Light Mode, Clean Data, Instant Step Counter & Auto Daily Reset)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.17)

            આ નવા વર્ઝનમાં કરવામાં આવેલા વિશેષ સુધારા:
            - **ડાર્ક મોડ અને લાઈટ મોડ સર્વાંગી સુધારો (Dark & Light Mode Polish):** દરેક મોબાઇલ સ્ક્રીન પર તમામ કાર્ડ્સ, મોડલ્સ, ઇનપુટ ફીલ્ડ્સ અને ટેક્સ્ટ ક્રિસ્ટલ ક્લિયર અને સ્પષ્ટ વંચાય તેવું ઉત્કૃષ્ટ કોન્ટ્રાસ્ટ અને કલર બેલેન્સિંગ.
            - **બધા ડમી/ડિફોલ્ટ ડેટા દૂર (Clean Initial State):** એપ ઇન્સ્ટોલ કરતી વખતે આવતી જૂની ડિફોલ્ટ એન્ટ્રીઓ (નોંધ, રિમાઇન્ડર, દવા, બેંક બેલેન્સ 42,500, ખાતા, શોપિંગ) સંપૂર્ણપણે હટાવીને એકદમ ક્લીન સ્લેટ રાખેલ છે.
            - **ઇન્સ્ટોલેશન પર ઓટોમેટિક સ્ટેપ કાઉન્ટિંગ શરૂ (Auto-Start Step Counter):** એપ્લિકેશન ઇન્સ્ટોલ કરી પરમિશન આપતાં જ કોઈ પણ બટન દબાવ્યા વિના બેકગ્રાઉન્ડમાં આપમેળે સ્ટેપ ગણતરી શરૂ થઈ જાય છે.
            - **તારીખ બદલાતાં આરોગ્ય વિગતો ઓટો-રીસેટ (Daily Midnight Auto-Reset):** દરરોજ મધ્યરાત્રિએ / નવી તારીખે પગલાં (Steps) અને પાણીના ગ્લાસ (Water glasses) આપમેળે 0 થઈ નવા દિવસ માટે તૈયાર થશે, અને જૂના દિવસનો ઇતિહાસ સાચવાઈ જશે.
            - **અલ્ટ્રા લાઇટવેઇટ સાઈઝ (<8 MB) અને સુપર સ્મૂથ ફાસ્ટ પર્ફોર્મન્સ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.17.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.17.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
