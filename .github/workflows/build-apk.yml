name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.29.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.29.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.29
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.29 Balance Sync, Clean Health UI & Lung Workout)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.29)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ ઊંડાણપૂર્વકના સુધારાઓ:
            - **💰 સિલક (બેલેન્સ) આપોઆપ અપડેટ (Real-time Balance Auto-Sync):**
              - SMS થી ખર્ચ કે આવક ઉમેરતાં જ બેંક સિલક (બેંક બેલેન્સ / રોકડ) માંથી આપોઆપ રકમ બાદ કે જમા થઈ જાય છે.
              - SMS માં બેંક દ્વારા મોકલાયેલ આખરી સિલક (Avl Bal) આપોઆપ પકડીને બેંક બેલેન્સ સાથે સેટ કરી દેવાય છે.
              - કેલ્ક્યુલેટર કે ખરીદી યાદીમાંથી ખર્ચ ઉમેરતાં પણ બેંક બેલેન્સ રિયલ-ટાઇમમાં અપડેટ થાય છે.
              - ભૂલથી થયેલ એન્ટ્રી ડિલીટ કરતાં સિલક પાછી પુનઃસ્થાપિત (Restore) થઈ જાય છે.
            - **✨ હેલ્થ હબ નેવિગેશન બારનું આકર્ષક એરેન્જમેન્ટ (Clean Single-Icon Health Tabs):**
              - ડબલ આઇકન અને ક્રેમ્પ્ડ ટેક્સ્ટની ખામી દૂર કરી.
              - હવે સિંગલ સ્પષ્ટ આઇકન સાથે સ્મૂથ હોરિઝોન્ટલ પિલ સ્લાઇડર ગોઠવ્યું છે, જે મોબાઇલમાં અત્યંત સુંદર અને આધુનિક દેખાય છે.
            - **🫁 ફેફસાં મજબૂત કરવા માટેની શાનદાર કસરત અને ટેસ્ટ (Lung Strengthening & Breath Trainer):**
              - **લાઈવ એનિમેટેડ પ્રાણાયામ:** ૪-૭-૮ ફેફસાં વિસ્તરણ પદ્ધતિ, બોક્સ બ્રિધિંગ (૪-૪-૪-૪), અનુલોમ-વિલોમ અને ડીપ લંગ એક્સ્પાન્શન (૫-૧૦-૫).
              - **ફેફસાં ક્ષમતા સ્ટોપવોચ ટેસ્ટ (Breath-Hold Test):** તમારા ફેફસાં કેટલી સેકન્ડ શ્વાસ રોકી શકે છે તેનું લાઈવ માપન, મેડિકલ સ્કોરિંગ અને પર્સનલ બેસ્ટ રેકોર્ડ સેવિંગ.
              - **૪ સુવર્ણ આયુર્વેદિક ટિપ્સ:** તુલસી-આદુ ઉકાળો, ગરમ પાણીની વરાળ, સવારની તાજી હવા અને હળદરવાળું દૂધ.
            - **⚡ સુપર સ્મૂથ અને અલ્ટ્રા ફાસ્ટ લૉન્ચ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.29.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.29.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
