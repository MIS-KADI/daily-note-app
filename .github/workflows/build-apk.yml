name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.11.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.11.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.11
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.11 Mobile Report Downloads & Instant Notification)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.11)

            આ નવા વર્ઝનમાં કરવામાં આવેલા મહત્વપૂર્ણ સુધારા:
            - **મોબાઈલ અને બ્રાઉઝરમાં રિપોર્ટ ડાઉનલોડ ફિક્સ:** હવે કમ્પ્યુટરની જેમ જ મોબાઈલ બ્રાઉઝર અને એન્ડ્રોઇડ એપમાં તમામ PDF તથા Excel/CSV રિપોર્ટ સીધા જ ડાઉનલોડ થાય છે.
            - **તત્કાલ નોટિફિકેશન એલર્ટ:** રિપોર્ટ ડાઉનલોડ થતાં જ તુરંત સ્ટેટસ બારમાં 📄 "રિપોર્ટ ડાઉનલોડ થઈ ગયો છે!" નું નોટિફિકેશન આવી જાય છે.
            - **ડાયરેક્ટ PDF અને Excel ઓપન/જુઓ:** રિપોર્ટ તૈયાર થતાં જ એક સુંદર શીટ ઓપન થાય છે જેમાં યુઝર એક જ ક્લિકમાં ડાયરેક્ટ PDF/એક્સેલ જોઈ શકે છે અથવા મોબાઈલ એપ્સ (WhatsApp, Google Drive PDF Viewer, Files) માં શેર કરી શકે છે.
            - **સુપર લાઇટવેઇટ સાઈઝ (<8 MB):** એપની સાઈઝ હજુ પણ અતિ હળવી ~૭.૮ MB જળવાઈ રહી છે.
            - **સંપૂર્ણ ડાર્ક મોડ અને શુદ્ધ ગુજરાતી ભાષા સપોર્ટ.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.11.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.11.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
