name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.4.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.4.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.4
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.4 Latest)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.4)

            આ નવા વર્ઝનમાં કરવામાં આવેલા ખાસ સુધારા:
            - **મોબાઇલ નંબર લંબાઈ અને ડિફોલ્ટ નંબર સુધારો:** મોબાઇલ નંબર હવે ફક્ત ૧૦ અંકનો જ રહેશે, જૂના ડમી નંબરો હટાવી દેવામાં આવ્યા છે જેથી કોઈ મુશ્કેલી ન આવે.
            - **સ્માર્ટ આસિસ્ટન્ટ સુધારો (Image 1):** વોઇસ આસિસ્ટન્ટમાંથી વધારાના ઉદાહરણોવાળા પ્રોમ્પ્ટ બોક્સ હટાવી એકદમ ક્લીન વિન્ડો બનાવી.
            - **કામો/રીમાઇન્ડર કાર્ડ સુધારો (Image 2):** કામોના કાર્ડમાંથી તાકીદ/ઉચ્ચ અને રીંગટોનના બિનજરૂરી ટેગ હટાવી કાર્ડને એકદમ સાફ અને વ્યવસ્થિત બનાવ્યું.
            - **ખાતાવહી કાર્ડ સુંદર લેઆઉટ (Image 3):** મોબાઇલ નંબર, WhatsApp અને UPI QR હવે એક જ લાઈનમાં આવશે, અને તારીખ તથા પાકતી તારીખ પણ એક જ લાઈનમાં ગોઠવવામાં આવી છે.
            - **સુપરફાસ્ટ પર્ફોર્મન્સ અને સ્મૂધ કામગીરી.**

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.4.apk`** પર ક્લિક કરીને સીધું ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.4.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
