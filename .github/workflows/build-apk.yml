name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.39.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.39.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.39
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.39 Offline/Online Dual Mode, Voice Petrol Fix & Calculator Expense Save)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.39)

            આ નવા વર્ઝન v1.0.39 માં કરવામાં આવેલા મહત્વપૂર્ણ સુધારાઓ:
            - **⚡ ઓનલાઈન અને ઓફલાઈન બંને મોડમાં ૧૦૦% કાર્યરત (Dual Online & Offline Mode):**
              - એપ ખોલતી વખતે આવતી બ્લોકિંગ સ્ક્રીન હટાવી લેવામાં આવી છે.
              - નેટ ના હોય તો પણ એપ આસાનીથી ખૂલશે, તમામ નોટ્સ, હિસાબ, ડાયરી અને સ્ટેપ કાઉન્ટર ચાલશે.
              - નેટ ચાલુ થતાં જ બધો ડેટા ક્લાઉડ સાથે ઓટો-સિંક થશે.
            - **🎙️ બોલીને ખર્ચ નોંધવામાં મોટો સુધારો (Voice Expense Accuracy Fix):**
              - "૨૦૦૦ નું પેટ્રોલ પુરાવ્યું" બોલતાં હવે પૂરા ₹૨,૦૦૦ ની જ એન્ટ્રી સેવ થશે (પહેલાં ડિફોલ્ટ ૧૦૦ થઈ જતું હતું તે સંપૂર્ણ ફિક્સ).
              - "મેં રોકડે થી પુરાવ્યું" બોલતાં પેમેન્ટ મોડ આપોઆપ 'રોકડ (Cash)' તરીકે સિલેક્ટ થશે અને કેશ બેલેન્સમાંથી રકમ કપાશે.
              - સ્માર્ટ આસિસ્ટન્ટમાં સેવ કરતાં પહેલાં રકમ એડિટ કરવાનો અને રોકડ/UPI/બેંક પસંદ કરવાનો વિકલ્પ પણ ઉમેરવામાં આવ્યો છે.
            - **🧮 કેલ્ક્યુલેટર ચેઈન કેલ્ક્યુલેશન અને સીધો ખર્ચ સેવ (Calculator Quick Expense Drawer):**
              - એકથી વધુ સરવાળા-બાદબાકી (જેમ કે ૧૦૦ + ૨૦૦ + ૩૦૦) ચોક્કસ પરિણામ આપશે.
              - ગણતરી કરેલી રકમને સીધી ખર્ચ અથવા આવકમાં સેવ કરવા માટે સમર્પિત ડ્રોઅર જેમાં રોકડ/UPI/બેંક અને કેટેગરી પસંદ કરી શકાય છે.
            - **📄 PDF સ્કેનર સેવ અને ગુગલ ડ્રાઈવ/ફાઈલ સ્ટોરેજ (PDF Scanner In-App & Drive Save):**
              - સ્કેન કરેલ PDF હવે એપની અંદર '📁 સેવ કરેલા સ્કેન' ગેલેરીમાં હંમેશા માટે સચવાશે.
              - ફોન સ્ટોરેજ, ગુગલ ડ્રાઈવ, WhatsApp કે ડાઉનલોડ્સ ફોલ્ડરમાં સેવ કરવાનો નેટિવ વિકલ્પ સંપૂર્ણ સક્રિય.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.39.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.39.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
