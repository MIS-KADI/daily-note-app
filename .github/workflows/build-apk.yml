name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Copy and Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk daily-diary-v1.0.41.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Daily-Diary-App.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-diary-apk
          path: |
            daily-diary-v1.0.41.apk
            Daily-Diary-App.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.41
          name: "Daily Diary & Smart Assistant - Android APK (v1.0.41 Clean Profile & Update)"
          body: |
            ### 📱 દૈનિક ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Android APK v1.0.41)

            આ નવા વર્ઝન v1.0.41 માં કરવામાં આવેલા મહત્વપૂર્ણ સુધારાઓ:
            - **✨ પ્રોફાઇલમાંથી Google Drive ઓટો-સિંક સેક્શન દૂર કરવામાં આવ્યું (Clean Profile):**
              - યુઝરની વિનંતી મુજબ પ્રોફાઇલમાંથી Google Drive ઓટો-સિંક અને બેકઅપ કાર્ડ સંપૂર્ણપણે હટાવી લેવામાં આવ્યું છે.
              - પ્રોફાઇલ પેજ હવે એકદમ સ્વચ્છ, સરળ અને ઝડપી બન્યું છે.
            - **⚡ ફાસ્ટ અને સ્મૂથ પર્ફોર્મન્સ:**
              - એપ્લિકેશનના તમામ ટેબ્સ (નોટ્સ, રિમાઇન્ડર્સ, હિસાબ, હેલ્થ/આંખોની કસરત, PDF સ્કેનર) વધુ ઝડપી અને સ્મૂથ રીતે કાર્ય કરે છે.

            નીચે આપેલ **`Daily-Diary-App.apk`** અથવા **`daily-diary-v1.0.41.apk`** પર ક્લિક કરીને ડાઉનલોડ કરો.
          files: |
            daily-diary-v1.0.41.apk
            Daily-Diary-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
