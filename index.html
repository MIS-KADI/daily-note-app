<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#070D32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Daily Diary" />
    <link rel="manifest" href="./manifest.json" />
    <title>રોજિંદી ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ (Daily Diary & Smart Assistant)</title>
    <!-- Google Fonts for Gujarati, Hindi, English & Multi-language Diary typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Hind+Vadodara:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Kalam:wght@300;400;700&family=Noto+Serif+Gujarati:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-amber-500 selection:text-white" style="margin: 0; padding: 0; background-color: #070D32; color: #f8fafc; overflow-x: hidden;">
    <div id="root">
      <!-- Instant 0ms Native Preload Splash (Zero White Flash) -->
      <div id="initial-splash" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #070D32; z-index: 99999; font-family: 'Hind Vadodara', sans-serif;">
        <div style="position: relative; width: 108px; height: 108px; margin-bottom: 24px;">
          <img src="./icon-192.png" alt="Daily Diary" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.4)); border-radius: 28px; animation: pulseGlow 2s infinite ease-in-out;" />
        </div>
        <h1 style="color: #fbbf24; font-size: 22px; font-weight: 700; margin: 0 0 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); letter-spacing: 0.5px;">
          રોજિંદી ડાયરી અને સ્માર્ટ આસિસ્ટન્ટ
        </h1>
        <p style="color: #94a3b8; font-size: 13px; margin: 0 0 24px; font-weight: 500;">
          તમારા દિવસની શ્રેષ્ઠ શરૂઆત...
        </p>
        <div style="width: 140px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden;">
          <div style="width: 100%; height: 100%; background: linear-gradient(90deg, #d97706, #fbbf24, #f59e0b); border-radius: 9999px; animation: shimmerLoad 1.5s infinite linear;"></div>
        </div>
        <style>
          @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.35)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 28px rgba(212, 175, 55, 0.65)); }
          }
          @keyframes shimmerLoad {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
